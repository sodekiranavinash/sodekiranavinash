name: Update profile stat cards

# Regenerates the self-hosted SVGs in assets/ from the public GitHub API and
# commits them back. No third-party widget service is involved, so the README
# cannot break when someone else's free tier goes down.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

concurrency:
  group: profile-assets

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh profile stat cards [skip ci]"
            git push
          fi
